name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" grafana-snapshot-*.zip --title "$GITHUB_REF_NAME" --generate-notes
      # Runs once all three Chrome Web Store secrets are configured (docs/publishing.md).
      - name: Submit to the Chrome Web Store
        if: env.CWS_PUBLISHER_ID != '' && env.CWS_EXTENSION_ID != '' && env.CWS_SERVICE_ACCOUNT_KEY != ''
        run: npm run publish:cws
